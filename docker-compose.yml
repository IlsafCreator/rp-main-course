version: "3.9"

services:
  redis:
    container_name: "redis_main"
    image: redis:latest
    ports:
      - "6379:6379"
  redis_rus:
    container_name: "redis_rus"
    image: redis:latest
    ports:
      - "6000:6379"
  redis_eu:
    image: redis:latest
    container_name: redis_eu
    ports:
      - "6001:6379"
  redis_other:
    image: redis:latest
    container_name: redis_other
    ports:
      - "6002:6379"
  nats:
    container_name: nats
    image: nats
    ports:
      - "4222:4222"